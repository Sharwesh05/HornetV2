#!/usr/sbin/nft -f
# Hornet honeypot host firewall (Phase H7). Review before use; replace the variables at the top.
#   check:  nft -c -f deployment/nftables.conf      apply:  sudo nft -f deployment/nftables.conf
#
# Policy: everything is dropped unless listed. The only public port is the decoy SSH gateway. The admin API is never
# reachable from outside: investigators come in over WireGuard. Twins have no network (Docker network "none"),
# and this host forwards nothing, so even a misconfigured container cannot reach the internet or the LAN.

define PUBLIC_IF   = "eth0"          # the internet-facing interface
define VPN_IF      = "wg0"           # WireGuard interface for investigators
define VPN_PORT    = 51820           # WireGuard UDP port
define DECOY_PORT  = 22              # HORNET_GATEWAY_PORT (the real sshd must listen elsewhere, see deployment/README.md)
define ADMIN_SSH   = 2202            # the operators' real sshd, VPN only
define API_PORT    = 8000            # Hornet admin API, VPN only (it binds to the VPN address or loopback)
define MGMT_DB     = 10.66.0.2       # PostgreSQL on the management host, over WireGuard
define NIM_TLS     = 443             # HTTPS to the AI provider (only needed with HORNET_AI_PROVIDER=nim)

flush ruleset

table inet hornet {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto ipv6-icmp accept comment "IPv6 neighbour discovery"
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept

    iifname $PUBLIC_IF tcp dport $DECOY_PORT ct state new limit rate 30/second burst 60 packets accept comment "decoy SSH"
    iifname $PUBLIC_IF udp dport $VPN_PORT accept comment "WireGuard"
    iifname $VPN_IF tcp dport { $ADMIN_SSH, $API_PORT } accept comment "operators and investigators, VPN only"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # nothing is routed through this host: no container, twin or VPN peer reaches anything via it
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oif "lo" accept
    oifname $VPN_IF accept comment "replies and the database on the management host"
    ip daddr $MGMT_DB tcp dport 5432 accept
    udp dport 53 accept comment "DNS for the host itself (twins have no network)"
    tcp dport 53 accept
    udp dport 123 accept comment "NTP"
    tcp dport $NIM_TLS accept comment "AI provider and OS updates over HTTPS; narrow to addresses if possible"
    udp dport $VPN_PORT accept comment "WireGuard"
  }
}
