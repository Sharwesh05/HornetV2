name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: setup
        run: python -m scripts.dev setup
      - name: lint
        run: python -m scripts.dev lint
      - name: unit tests (no Docker)
        run: python -m scripts.dev test -m "not docker"

  docker:
    name: docker integration (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: setup
        run: python -m scripts.dev setup
      - name: start the twin base image and both demo servers
        run: python -m scripts.dev demo-up
      - name: full test suite, including real-Docker isolation and gateway tests
        # a skipped Docker test here means the environment is broken, not that it passed: fail on any skip
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.dev test -rs | tee test.log
          if grep -q "SKIPPED" test.log; then echo "::error::tests were skipped in the Docker job"; exit 1; fi
      - name: stop demo servers and remove leftover twins
        if: always()
        run: python -m scripts.dev demo-down

  dashboard:
    name: dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (exact versions from the lockfile)
        run: python -m scripts.dev ui-setup
      - name: lint, type check, tests (incl. XSS and raw-vs-AI separation), production build
        run: python -m scripts.dev ui-check
