[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hornet"
version = "0.1.0"
description = "AI-powered digital twin honeypot: management plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "docker>=7.1",
    "httpx>=0.27",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.11", "psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
markers = ["docker: needs a Docker daemon and the hornet-twin-base:1 image"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # the docker SDK ships no type information
plugins = ["pydantic.mypy"]  # field defaults and validators

# AGENTS.md: strict where security decisions are made. mypy cannot apply `strict` per module (it would apply to
# everything), so the strict flags are listed explicitly.
[[tool.mypy.overrides]]
module = ["app.sanitization.*", "app.ai.*", "app.orchestration.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
